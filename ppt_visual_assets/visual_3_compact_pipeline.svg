<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      .title { font-size: 34px; font-weight: 900; fill: #0F172A; letter-spacing: -0.8px; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #475569; }
      .badge-text { font-size: 11px; font-weight: 800; fill: #0284C7; letter-spacing: 1.2px; text-transform: uppercase; }
      
      .pipe-node-title { font-size: 14px; font-weight: 900; fill: #0F172A; }
      .pipe-node-tag { font-size: 10px; font-weight: 700; fill: #2563EB; letter-spacing: 0.5px; }
      .mini-pill { font-size: 10px; font-weight: 700; fill: #2563EB; }
    </style>

    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    
    <pattern id="dot-pat" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="1920" height="1080" fill="#FFFFFF" />
  <rect width="1920" height="1080" fill="url(#dot-pat)" opacity="0.7" />

  <!-- Outer Presentation Margin Border -->
  <rect x="36" y="30" width="1848" height="1020" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#0284C7" />
    <text x="26" y="17" class="badge-text">Compact AI Pipeline</text>

    <text x="0" y="62" class="title">NexSpace Streamlined Multimodal Pipeline</text>
    <text x="0" y="88" class="subtitle">High-density slide-ready architecture: from raw satellite acquisition to explainable geospatial insights</text>
  </g>

  <!-- ================= HORIZONTAL COMPACT PIPELINE ================= -->
  <g transform="translate(70, 215)">
    <!-- Container Card -->
    <rect width="1780" height="690" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="drop-shadow(0 10px 30px rgba(15,23,42,0.05))" />

    <!-- Top Flow Track Bar -->
    <rect x="30" y="35" width="1720" height="6" rx="3" fill="#F1F5F9" />

    <!-- ================= 7 MAIN PIPELINE STAGES ================= -->

    <!-- STAGE 1: SATELLITE IMAGERY -->
    <g transform="translate(30, 65)">
      <rect width="215" height="560" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF" />
      <circle cx="34" cy="34" r="7" stroke="#2563EB" stroke-width="2" fill="none" />
      <path d="M 34 22 L 34 25 M 34 43 L 34 46 M 22 34 L 25 34 M 43 34 L 46 34" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" />

      <text x="16" y="74" class="pipe-node-title">SATELLITE IMAGERY</text>
      <text x="16" y="90" class="pipe-node-tag">RAW INGESTION</text>
      <line x1="16" y1="104" x2="199" y2="104" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Items -->
      <g transform="translate(16, 125)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Optical EO</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">RGB / SWIR (0.5m)</text>
      </g>
      <g transform="translate(16, 185)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">SAR Radar</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Sentinel-1 (VV/VH)</text>
      </g>
      <g transform="translate(16, 245)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Commercial SAR</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Capella Space / ICEYE</text>
      </g>
      <g transform="translate(16, 305)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Multi-Temporal</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Historical Archives</text>
      </g>

      <rect x="16" y="505" width="183" height="30" rx="4" fill="#EFF6FF" />
      <text x="24" y="524" class="mono" font-size="10" font-weight="700" fill="#2563EB">TELEMETRY INGEST</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 250 345 L 275 345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pipe-arrow)" />

    <!-- STAGE 2: INPUT VALIDATION -->
    <g transform="translate(280, 65)">
      <rect width="215" height="560" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#F0F9FF" />
      <rect x="25" y="25" width="18" height="18" rx="3" stroke="#0284C7" stroke-width="2" fill="none" />
      <path d="M 29 34 L 33 38 L 39 30" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />

      <text x="16" y="74" class="pipe-node-title">INPUT VALIDATION</text>
      <text x="16" y="90" font-size="10" font-weight="700" fill="#0284C7" letter-spacing="0.5px">TELEMETRY &amp; GSD</text>
      <line x1="16" y1="104" x2="199" y2="104" stroke="#E2E8F0" stroke-width="1.2" />

      <g transform="translate(16, 125)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">GSD Resolution</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Ground Sampling Rate</text>
      </g>
      <g transform="translate(16, 185)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Cloud Masking</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Shadow / Obscuration</text>
      </g>
      <g transform="translate(16, 245)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Footprint AOI</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Bounding Polygon</text>
      </g>
      <g transform="translate(16, 305)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Sensor Calibration</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">Radiometric Check</text>
      </g>

      <rect x="16" y="505" width="183" height="30" rx="4" fill="#F0F9FF" />
      <text x="24" y="524" class="mono" font-size="10" font-weight="700" fill="#0284C7">QUALITY GATE PASS</text>
