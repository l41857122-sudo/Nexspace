      <g transform="translate(16, 305)">
        <rect width="183" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="22" font-size="12" font-weight="700" fill="#0F172A">Tiling &amp; Pyramids</text>
        <text x="12" y="38" font-size="10" font-weight="500" fill="#64748B">GeoTIFF COG Tiles</text>
