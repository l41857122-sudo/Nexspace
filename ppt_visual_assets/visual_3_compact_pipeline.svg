        <text x="12" y="42" font-size="10.5" font-weight="500" fill="#475569">Zero-Shot Questions &amp; Audit</text>
      </g>
      <g transform="translate(16, 190)">
        <rect width="218" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
        <text x="12" y="24" font-size="13" font-weight="800" fill="#0F172A">Captioning</text>
        <text x="12" y="42" font-size="10.5" font-weight="500" fill="#475569">Dense Scene Descriptions</text>
      </g>
      <g transform="translate(16, 255)">
        <rect width="218" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
        <text x="12" y="24" font-size="13" font-weight="800" fill="#0F172A">Grounding</text>
        <text x="12" y="42" font-size="10.5" font-weight="500" fill="#475569">Pixel Bounding Box [x,y,w,h]</text>
      </g>
      <g transform="translate(16, 320)">
        <rect width="218" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
        <text x="12" y="24" font-size="13" font-weight="800" fill="#0F172A">Change Detect</text>
        <text x="12" y="42" font-size="10.5" font-weight="500" fill="#475569">Bi-Temporal Delta &amp; Masks</text>
      </g>

      <rect x="16" y="505" width="218" height="30" rx="4" fill="#EFF6FF" />
      <text x="24" y="524" class="mono" font-size="10" font-weight="800" fill="#2563EB">PARALLEL INFERENCE</text>
