  <!-- Footer Metadata -->
  <g transform="translate(70, 1020)">
    <text x="0" y="0" font-size="12" font-weight="800" fill="#0F172A">NEXSPACE</text>
    <text x="80" y="0" font-size="12" font-weight="500" fill="#64748B">|  COMPACT SLIDE-READY PIPELINE</text>
    <text x="1780" y="0" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#64748B">FIGURE 3: EXPLAINABLE MULTIMODAL REMOTE SENSING AI</text>
  </g>
</svg>