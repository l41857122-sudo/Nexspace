    <g transform="translate(1585, 65)">
      <rect width="165" height="560" rx="10" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#DCFCE7" />
      <path d="M 34 24 L 36 30 L 42 30 L 37 34 L 39 40 L 34 36 L 29 40 L 31 34 L 26 30 L 32 30 Z" fill="#16A34A" />

      <text x="16" y="74" class="pipe-node-title" font-size="13" fill="#15803D">ACTIONABLE</text>
      <text x="16" y="90" class="pipe-node-title" font-size="13" fill="#15803D">INSIGHT</text>
      <line x1="16" y1="104" x2="149" y2="104" stroke="#BBF7D0" stroke-width="1.2" />

      <g transform="translate(12, 125)">
        <rect width="141" height="48" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
        <text x="10" y="24" font-size="11" font-weight="800" fill="#15803D">Mission Decisions</text>
        <text x="10" y="38" font-size="9" font-weight="500" fill="#64748B">Strategic C2</text>
      </g>

      <g transform="translate(12, 185)">
        <rect width="141" height="48" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
        <text x="10" y="24" font-size="11" font-weight="800" fill="#15803D">PDF Briefings</text>
        <text x="10" y="38" font-size="9" font-weight="500" fill="#64748B">Signed Audit</text>
      </g>

      <g transform="translate(12, 245)">
        <rect width="141" height="48" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
        <text x="10" y="24" font-size="11" font-weight="800" fill="#15803D">Tactical Alerts</text>
        <text x="10" y="38" font-size="9" font-weight="500" fill="#64748B">Instant Trigger</text>
      </g>

      <!-- Final Tagline Badge -->
