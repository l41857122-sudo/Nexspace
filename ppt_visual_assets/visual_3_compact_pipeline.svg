      <rect x="16" y="16" width="36" height="36" rx="8" fill="#F0F9FF" />
      <path d="M 27 27 L 41 41 M 41 27 L 27 41" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" />

      <text x="16" y="74" class="pipe-node-title" font-size="14.5" fill="#0284C7">MULTIMODAL REASONING</text>
      <text x="16" y="90" font-size="10" font-weight="700" fill="#0284C7" letter-spacing="0.5px">CROSS-SENSOR FUSION</text>
      <line x1="16" y1="104" x2="229" y2="104" stroke="#BAE6FD" stroke-width="1.5" />

      <g transform="translate(16, 125)">
        <rect width="213" height="58" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Optical + SAR</text>
        <text x="12" y="44" font-size="10.5" font-weight="500" fill="#0284C7">Cross-Spectrum Validation</text>
      </g>

      <g transform="translate(16, 195)">
        <rect width="213" height="58" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Multi-Temporal</text>
        <text x="12" y="44" font-size="10.5" font-weight="500" fill="#0284C7">Time-Series Coherence</text>
      </g>

      <g transform="translate(16, 265)">
        <rect width="213" height="58" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Agent Controller</text>
        <text x="12" y="44" font-size="10.5" font-weight="500" fill="#0284C7">Iterative Synthesis Loop</text>
      </g>

      <rect x="16" y="505" width="213" height="30" rx="4" fill="#F0F9FF" />
      <text x="24" y="524" class="mono" font-size="10" font-weight="800" fill="#0284C7">DYNAMIC REASONING</text>
