      <text x="16" y="90" class="pipe-node-tag">CALIBRATED AUDIT</text>
      <line x1="16" y1="104" x2="189" y2="104" stroke="#E2E8F0" stroke-width="1.2" />

      <g transform="translate(14, 125)">
        <rect width="177" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Bounding Boxes</text>
        <text x="12" y="42" font-size="10" font-weight="500" fill="#64748B">Geo-Spatial Precision</text>
      </g>
      <g transform="translate(14, 195)">
        <rect width="177" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Confidence Score</text>
        <text x="12" y="42" font-size="10" font-weight="500" fill="#64748B">Calibrated (94.8%)</text>
      </g>
      <g transform="translate(14, 265)">
        <rect width="177" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="24" font-size="12" font-weight="800" fill="#0F172A">Execution Trace</text>
        <text x="12" y="42" font-size="10" font-weight="500" fill="#64748B">Audit Timestamps</text>
      </g>

      <rect x="14" y="505" width="177" height="30" rx="4" fill="#EFF6FF" />
      <text x="20" y="524" class="mono" font-size="10" font-weight="700" fill="#2563EB">ZERO-HALLUCINATION</text>
    </g>

    <!-- Arrow 6 -> 7 -->
    <path d="M 1555 345 L 1580 345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pipe-arrow)" />

