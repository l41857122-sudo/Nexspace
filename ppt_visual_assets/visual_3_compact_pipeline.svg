    <!-- Arrow 5 -> 6 -->
    <path d="M 1315 345 L 1340 345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pipe-arrow)" />

    <!-- STAGE 6: EVIDENCE -->
    <g transform="translate(1345, 65)">
      <rect width="205" height="560" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF" />
      <path d="M 34 22 L 26 26 L 26 36 C 26 41 34 44 34 44 C 34 44 42 41 42 36 L 42 26 Z" stroke="#2563EB" stroke-width="2" fill="none" />

