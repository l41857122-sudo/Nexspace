      <rect x="16" y="505" width="183" height="30" rx="4" fill="#EFF6FF" />
      <text x="24" y="524" class="mono" font-size="10" font-weight="700" fill="#2563EB">ARD DATA READY</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 750 345 L 775 345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pipe-arrow)" />

    <!-- STAGE 4 (HERO): AI PERCEPTION -->
    <g transform="translate(780, 65)">
      <rect width="250" height="560" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2" filter="drop-shadow(0 6px 18px rgba(37,99,235,0.1))" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF" />
      <!-- AI Chip Icon -->
      <rect x="25" y="25" width="18" height="18" rx="3" stroke="#2563EB" stroke-width="2" fill="none" />
      <circle cx="34" cy="34" r="3" fill="#2563EB" />

      <text x="16" y="74" class="pipe-node-title" font-size="15" fill="#2563EB">AI PERCEPTION</text>
      <text x="16" y="90" class="pipe-node-tag">SPECIALIST ENGINES</text>
      <line x1="16" y1="104" x2="234" y2="104" stroke="#BFDBFE" stroke-width="1.5" />

