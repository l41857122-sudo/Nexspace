        <rect width="145" height="115" rx="8" fill="#16A34A" />
        <text x="14" y="32" font-size="11" font-weight="900" fill="#FFFFFF">EXPLAINABLE</text>
        <text x="14" y="52" font-size="11" font-weight="900" fill="#FFFFFF">GEOSPATIAL</text>
        <text x="14" y="72" font-size="11" font-weight="900" fill="#FFFFFF">INTELLIGENCE</text>
        <line x1="14" y1="84" x2="131" y2="84" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
        <text x="14" y="100" class="mono" font-size="9" font-weight="700" fill="#DCFCE7">VERIFIED OUTPUT</text>
