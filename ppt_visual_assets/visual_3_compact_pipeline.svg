    <!-- Arrow 2 -> 3 -->
    <path d="M 500 345 L 525 345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pipe-arrow)" />

    <!-- STAGE 3: PREPROCESSING -->
    <g transform="translate(530, 65)">
      <rect width="215" height="560" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#EFF6FF" />
      <!-- Layers Icon -->
