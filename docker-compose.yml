version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nexspace_postgres
    environment:
      POSTGRES_DB: nexspace
      POSTGRES_USER: nexspace_user
      POSTGRES_PASSWORD: nexspace_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexspace_user -d nexspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexspace_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: nexspace_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  processing:
    build:
      context: ./processing
      dockerfile: Dockerfile
    container_name: nexspace_processing
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./processing:/app
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
  miniodata:
